name: Live test build

# Builds this branch the way a release is built -- Release configuration, both
# NVIDIA SDKs required -- and lays the result over the published 0.6.0 bundle,
# so it can be tried on a real RTX card without anyone assembling it by hand.
#
# The Optical Flow SDK's D3D12 header sits behind an NVIDIA developer login and
# its licence forbids redistributing it, so it is never committed: the five
# NvOFInterface headers travel as an encrypted repository secret, are checked
# against a recorded SHA-256, used for the build, and deleted from the runner.
# Secrets are not passed to workflows run for pull requests from other forks.
#
# What comes out is an Actions artifact, not a release: it expires, it is not
# listed anywhere, and nothing here publishes, tags or pushes.
#
# The two executables and the test tools are built from this commit. Every
# other file is taken unchanged from xilla420's v0.6.0 zip, whose SHA-256 is
# checked against the value recorded when it was audited.

on:
  workflow_dispatch:
  # A fork registers no workflow until one has run, and workflow_dispatch alone
  # can never be the first run. A push that touches this file is.
  push:
    branches: ['security-*']
    paths: ['.github/workflows/live-test-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26

      - name: Fetch the NVIDIA DLSS SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch v310.9.16 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS sdk-dlss
          $commit = git -C sdk-dlss rev-parse HEAD
          if ($commit -ne '9981c6350dc58c0ce21f024fd65e31e851c31689') {
            Write-Error "NVIDIA/DLSS v310.9.16 resolved to $commit, not the reviewed commit."
            exit 1
          }
          git -C sdk-dlss sparse-checkout set include lib

      # NVIDIA Optical Flow SDK 5.0.7, NvOFInterface/*.h only, as a base64 zip.
      # The secret reaches this one step and no other. The digest pins the exact
      # headers that were reviewed, so a replaced secret stops the build here.
      - name: Unpack the NVIDIA Optical Flow SDK headers
        shell: pwsh
        env:
          NVOF_INTERFACE_ZIP_B64: ${{ secrets.NVOF_INTERFACE_ZIP_B64 }}
        run: |
          if (-not $env:NVOF_INTERFACE_ZIP_B64) {
            Write-Error "Secret NVOF_INTERFACE_ZIP_B64 is not set. Without the Optical Flow SDK there is no motion field."
            exit 1
          }
          $zip = Join-Path $env:RUNNER_TEMP 'nvof.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($env:NVOF_INTERFACE_ZIP_B64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '539a55c7bd4fad8a5f4665872ad2be7afcc80a0e67bb681fbecf618225826cc7') {
            Remove-Item $zip
            Write-Error "The Optical Flow headers in the secret are not the reviewed ones (SHA-256 $hash)."
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath sdk-nvof -Force
          Remove-Item $zip
          if (-not (Test-Path sdk-nvof\NvOFInterface\nvOpticalFlowD3D12.h)) {
            Write-Error "The secret does not hold NvOFInterface\nvOpticalFlowD3D12.h."
            exit 1
          }

      # SIDECAR_REQUIRE_SDKS turns a missing SDK into a configure error, so this
      # build cannot quietly come out without optical flow.
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DSIDECAR_REQUIRE_SDKS=ON
          -DDLSS_SDK_DIR=${{ github.workspace }}/sdk-dlss
          -DNVOF_SDK_DIR=${{ github.workspace }}/sdk-nvof

      - name: Build
        run: cmake --build build --config Release

      # The headers have done their job. Nothing later needs them, and the
      # artifact step must not be able to pick them up by accident.
      - name: Remove the Optical Flow headers from the runner
        if: always()
        shell: pwsh
        run: if (Test-Path sdk-nvof) { Remove-Item sdk-nvof -Recurse -Force }

      - name: Unit tests
        run: build\tests\Release\sidecar_tests.exe "[unit]"

      - name: Check the binaries against the safety invariants
        run: python ci/check_imports.py build\Release\wowsidecar.exe build\Release\wowsidecar-manager.exe build\Release\testpattern.exe

      # Reading a public release, nothing more. The digest is the one recorded
      # in the audit (Obsidian, DLSS5 Fork / FAZ 1); any other file stops here.
      - name: Fetch the audited 0.6.0 bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0 -R xilla420/dlss5-wow-sidecar -p 'dlss5-wow-sidecar-v0.6.0.zip'
          $hash = (Get-FileHash dlss5-wow-sidecar-v0.6.0.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '6eda271b81b885f35ba1510a9ee016556dea8d55fcc4aadfe17488c8cca3094c') {
            Write-Error "The v0.6.0 zip is $hash, not the audited build."
            exit 1
          }
          Expand-Archive dlss5-wow-sidecar-v0.6.0.zip -DestinationPath base

      - name: Assemble the test bundle
        shell: pwsh
        run: |
          $stage = 'dlss5-live-test'
          Copy-Item base\dlss5-wow-sidecar $stage -Recurse
          # The two executables are replaced; the stale build manifest describes
          # the old ones and goes with them.
          Copy-Item build\Release\wowsidecar.exe, build\Release\wowsidecar-manager.exe $stage -Force
          Remove-Item "$stage\BUILD-MANIFEST.json"
          # testpattern stands in for the game, so the overlay can be tried on a
          # window that is not WoW at all.
          Copy-Item build\Release\testpattern.exe $stage
          New-Item -ItemType Directory "$stage\tests" | Out-Null
          Copy-Item build\tests\Release\sidecar_tests.exe, build\Release\testpattern.exe "$stage\tests"

          $files = Get-ChildItem $stage -Recurse -File | ForEach-Object {
            $name = $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $name
          }
          @(
            "commit $env:GITHUB_SHA"
            "run    $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "base   dlss5-wow-sidecar-v0.6.0.zip 6eda271b81b885f35ba1510a9ee016556dea8d55fcc4aadfe17488c8cca3094c"
            "sdks   DLSS v310.9.16 (9981c63); Optical Flow SDK 5.0.7 NvOFInterface headers (539a55c7)"
            ""
          ) + $files | Set-Content "$stage\BUILD-INFO.txt" -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dlss5-live-test
          path: dlss5-live-test
          retention-days: 7
          if-no-files-found: error
